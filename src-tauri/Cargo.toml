[package]
name = "orbit"
version = "0.1.0"
description = "A fast, beautiful Windows app launcher"
authors = ["Orbit"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
